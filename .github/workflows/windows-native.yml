name: Native Windows build and offline tests

on:
  push:
    paths:
      - 'rebuild/windows/**'
      - 'models-4.6.json'
      - 'rk-drive-catalog.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/windows-native.yml'
  pull_request:
    paths:
      - 'rebuild/windows/**'
      - 'models-4.6.json'
      - 'rk-drive-catalog.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/windows-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline-analysis test dependencies
        run: python -m pip install pefile==2024.8.26 capstone==5.0.9
      - name: Python synthetic regression tests
        run: python -m unittest discover -s tests -v
      - name: Native pure-model and codec tests
        shell: pwsh
        run: ./rebuild/windows/test.ps1
      - name: Build self-contained Windows executable
        shell: pwsh
        run: ./rebuild/windows/build.ps1
      - name: Smoke-test published EXE without protocol traffic
        shell: pwsh
        run: ./rebuild/windows/smoke-test.ps1 -OutputDirectory "$env:RUNNER_TEMP/rk-smoke"
      - name: Build and inspect per-user MSI without installing
        shell: pwsh
        run: ./rebuild/windows/installer/build-installer.ps1
      - name: Check out immutable previous release for upgrade testing
        uses: actions/checkout@v4
        with:
          ref: 911a50e7f91a2fa8ffd19ea0f4dadda93c526821
          path: .ci-previous
      - name: Build previous executable and package using current installer tooling
        shell: pwsh
        run: |
          $previous = Join-Path $env:GITHUB_WORKSPACE '.ci-previous'
          Push-Location
          try { & "$previous/rebuild/windows/build.ps1" }
          finally { Pop-Location }
          & "$env:GITHUB_WORKSPACE/rebuild/windows/installer/build-installer.ps1" -SourceExe "$previous/rebuild/windows/dist/RK-Rebuild.exe" -VersionProject "$previous/rebuild/windows/RKRebuild.csproj" -OutputDirectory "$env:RUNNER_TEMP/rk-previous-installer"
      - name: Exercise installer lifecycle only on disposable hosted runner
        shell: pwsh
        run: ./rebuild/windows/installer/test-installer-standard-user.ps1 -CurrentMsiPath './rebuild/windows/dist/installer/RK-Rebuild-0.6.2-win-x64-experimental.msi' -PreviousMsiPath "$env:RUNNER_TEMP/rk-previous-installer/RK-Rebuild-0.5.0-win-x64-experimental.msi" -SourceExe './rebuild/windows/dist/RK-Rebuild.exe' -ConfirmDisposableVm
      - name: Retain installer lifecycle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RK-Rebuild-installer-lifecycle
          path: ${{ runner.temp }}/rk-installer-lifecycle-*/
          if-no-files-found: warn
      - name: Upload native Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RK-Rebuild-windows-x64
          path: |
            rebuild/windows/dist/RK-Rebuild.exe
            rebuild/windows/dist/RK-Rebuild.exe.sha256
            rebuild/windows/dist/installer/*.msi
            rebuild/windows/dist/installer/*.msi.sha256
          if-no-files-found: error
